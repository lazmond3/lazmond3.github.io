<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>姓名判断簡易計算ツール</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>姓名判断簡易計算ツール</h1>

<section>
  <h2>① 名前1・2を指定して運勢を表示</h2>
  <div class="input-group">
    <label>名前1画数</label>
    <input type="number" id="name1" min="1" max="50" inputmode="numeric">
  </div>
  <div class="input-group">
    <label>名前2画数</label>
    <input type="number" id="name2" min="1" max="50" inputmode="numeric">
  </div>
  <button id="btn1">運勢を表示</button>
  <div id="result1"></div>
</section>

<hr>

<section>
  <h2>② 名前1を指定して全候補(1〜20画)を表示</h2>
  <div class="input-group">
    <label>名前1画数</label>
    <input type="number" id="name1_search" min="1" max="50" inputmode="numeric">
  </div>
  <button id="btn2">一覧を表示</button>
  <div id="result2"></div>
</section>

<script src="script.js"></script>
</body>
</html>
